          ]

          OFFICIAL_CHANGE_KEYWORDS = [
              "appointment",
              "appointed",
              "transfer",
              "transferred",
              "posting",
              "posted",
              "additional charge",
              "assumption of charge",
              "relinquishment of charge",
              "retirement",
              "retired",
              "secretary",
              "additional secretary",
              "joint secretary",
              "chairperson",
              "chairman",
              "director general",
              "chief executive officer",
              "member secretary"
          ]

          ROUTINE_EXCLUSION_KEYWORDS = [
              "section 3a",
              "section 3d",
              "section 20a",
              "section 20e",
              "section 20(e)",
              "declaration of acquisition of land",
              "land acquisition",
              "acquisition of land",
              "competent authority for land acquisition",
              "village land",
              "survey number",
              "toll plaza",
              "user fee notification",
              "national highway land"
          ]

          IMPORTANT_AGENCIES = [
              "morth",
              "ministry of road transport",
              "ministry of heavy industries",
              "department of heavy industry",
              "moefcc",
              "ministry of environment",
              "ministry of petroleum",
              "ministry of commerce",
              "dpiit",
              "dgft",
              "bureau of indian standards",
              "bis",
              "caqm",
              "commission for air quality management",
              "niti aayog",
              "ministry of power",
              "ministry of new and renewable energy",
              "mnre",
              "ministry of railways"
          ]

          # -------------------------------------------------
          # HELPER FUNCTIONS
          # -------------------------------------------------

          def clean_text(value):
              return " ".join(
                  str(value or "").split()
              ).strip()

          def safe_filename(value):
              value = re.sub(
                  r"[^A-Za-z0-9._-]+",
                  "_",
                  value
              )

              return value.strip("_")[:120]

          def load_seen_ids():
              try:
                  with STATE_FILE.open(
                      "r",
                      encoding="utf-8"
                  ) as state_file:
                      loaded = json.load(state_file)

                  if isinstance(loaded, list):
                      return set(
                          str(item)
                          for item in loaded
                      )

              except (
                  FileNotFoundError,
                  json.JSONDecodeError
              ):
                  pass

              return set()

          def save_seen_ids(seen_ids):
              with STATE_FILE.open(
                  "w",
                  encoding="utf-8"
              ) as state_file:
                  json.dump(
                      sorted(seen_ids),
                      state_file,
                      indent=2,
                      ensure_ascii=False
                  )

          def contains_any(text, values):
              return any(
                  value in text
                  for value in values
              )

          def primary_screen(record):
              ministry = record["ministry"].lower()
              department = record["department"].lower()
              title = record["title"].lower()

              combined = clean_text(
                  f"{ministry} {department} {title}"
              ).lower()

              relevant_ministry = contains_any(
                  combined,
                  RELEVANT_MINISTRIES
              )

              relevant_subject = contains_any(
                  combined,
                  RELEVANT_KEYWORDS
              )

              official_change = (
                  contains_any(
                      combined,
                      OFFICIAL_CHANGE_KEYWORDS
                  )
                  and
                  contains_any(
                      combined,
                      IMPORTANT_AGENCIES
                  )
              )

              routine_exclusion = contains_any(
                  combined,
                  ROUTINE_EXCLUSION_KEYWORDS
              )

              # Government-affairs exception:
              # transfers and appointments in relevant
              # ministries must still be analysed.
              if official_change:
                  return (
                      True,
                      "Relevant ministry official change"
                  )

              # Routine acquisition notices are excluded
              # unless another strong automotive subject
              # is clearly present.
              if routine_exclusion and not relevant_subject:
                  return (
                      False,
                      "Routine land/toll notification"
                  )

              if relevant_subject:
                  return (
                      True,
                      "Automotive/business keyword match"
                  )

              if relevant_ministry:
                  return (
                      True,
                      "Relevant ministry review"
                  )

              return (
                  False,
                  "No preliminary automotive relevance"
              )

          def extract_pdf_text(pdf_path):
              reader = PdfReader(str(pdf_path))

              extracted_pages = []

              for page_number, page in enumerate(
                  reader.pages,
                  start=1
              ):
                  try:
                      page_text = (
                          page.extract_text() or ""
                      )

                  except Exception as error:
                      print(
                          f"Page {page_number} extraction "
                          f"warning: {error}"
                      )

                      page_text = ""

                  page_text = clean_text(page_text)

                  if page_text:
                      extracted_pages.append(
                          f"[PAGE {page_number}]\n"
                          f"{page_text}"
                      )

              full_text = "\n\n".join(
                  extracted_pages
              )

              return full_text[
                  :MAX_CHARACTERS_PER_PDF
              ]

          def find_pdf_in_viewer(
              context,
              viewer_page,
              gazette_number
          ):
              output_name = (
                  safe_filename(gazette_number)
                  + ".pdf"
              )

              output_path = (
                  DOWNLOAD_DIR / output_name
              )

              viewer_page.set_default_timeout(
                  120000
              )

              try:
                  viewer_page.wait_for_load_state(
                      "domcontentloaded",
                      timeout=120000
                  )

              except PlaywrightTimeoutError:
                  print(
                      "Viewer load timeout ignored."
                  )

              viewer_page.wait_for_timeout(8000)

              viewer_html = viewer_page.content()

              diagnostic_html = (
                  DIAGNOSTIC_DIR
                  / (
                      safe_filename(gazette_number)
                      + "_viewer.html"
                  )
              )

              diagnostic_html.write_text(
                  viewer_html,
                  encoding="utf-8"
              )

              candidate_urls = []

              def add_candidate(candidate):
                  if not candidate:
                      return

                  candidate = unquote(
                      str(candidate).strip()
                  )

                  if candidate.startswith(
                      "javascript:"
                  ):
                      return

                  absolute_url = urljoin(
                      viewer_page.url,
                      candidate
                  )

                  if absolute_url not in candidate_urls:
                      candidate_urls.append(
                          absolute_url
                      )

              selectors = [
                  ("iframe", "src"),
                  ("embed", "src"),
                  ("object", "data"),
                  ("source", "src"),
                  ("a", "href")
              ]

              for selector, attribute in selectors:
                  elements = viewer_page.locator(
                      selector
                  )

                  for index in range(
                      elements.count()
                  ):
                      try:
                          add_candidate(
                              elements
                              .nth(index)
                              .get_attribute(attribute)
                          )

                      except Exception:
                          pass

              for frame in viewer_page.frames:
                  if (
                      frame.url
                      and
                      frame.url != viewer_page.url
                  ):
                      add_candidate(frame.url)

              patterns = [
                  r"""[^"']+\.pdf(?:\?[^"']*?)["']""",
                  r"""[^"']*(?:GetPDF|DownloadPDF|ViewFile|DownloadFile[^"']*)["']"""
              ]

              for pattern in patterns:
                  for match in re.findall(
                      pattern,
                      viewer_html,
                      flags=re.IGNORECASE
                  ):
                      add_candidate(match)

              for candidate_url in candidate_urls:
                  try:
                      print(
                          "Testing PDF candidate:",
                          candidate_url
                      )

                      response = context.request.get(
                          candidate_url,
                          headers={
                              "Referer": viewer_page.url
                          },
                          timeout=120000,
                          fail_on_status_code=False
                      )

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      body = response.body()

                      is_pdf = (
                          body[:4] == b"%PDF"
                          or
                          "application/pdf"
                          in content_type.lower()
                      )

                      if is_pdf:
                          output_path.write_bytes(body)

                          print(
                              "PDF saved:",
                              output_path
                          )

                          return output_path

                  except Exception as error:
                      print(
                          "PDF candidate warning:",
                          str(error)
                      )

              return None

          def download_pdf(
              page,
              context,
              button,
              gazette_number
          ):
              captured_pdf = {
                  "body": None,
                  "url": ""
              }

              def capture_pdf_response(response):
                  if captured_pdf["body"] is not None:
                      return

                  try:
                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      content_disposition = (
                          response.headers.get(
                              "content-disposition",
                              ""
                          )
                      )

                      if (
                          "application/pdf"
                          in content_type.lower()
                          or
                          ".pdf"
                          in content_disposition.lower()
                      ):
                          body = response.body()

                          if body[:4] == b"%PDF":
                              captured_pdf["body"] = body
                              captured_pdf["url"] = (
                                  response.url
                              )

                  except Exception:
                      pass

              context.on(
                  "response",
                  capture_pdf_response
              )

              button.scroll_into_view_if_needed()

              page.wait_for_timeout(1000)

              viewer_page = None

              try:
                  with context.expect_page(
                      timeout=120000
                  ) as popup_info:
                      button.click(
                          force=True,
                          timeout=120000
                      )

                  viewer_page = popup_info.value

              except PlaywrightTimeoutError:
                  print(
                      "No viewer popup detected for:",
 
