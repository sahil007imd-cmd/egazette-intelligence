name: eGazette PDF AI Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

permissions:
  contents: write

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: python -m pip install requests beautifulsoup4

      - name: Check eGazette and send update
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          python - <<'PY'
          import json
          import re
          import html
          import requests
          import urllib3
          from bs4 import BeautifulSoup

          urllib3.disable_warnings()

          state_file = "seen_gazette_ids.json"
          public_source_link = "https://egazette.gov.in/RecentUploads.aspx?Category=6"

          automobile_keywords = [
              "road transport",
              "motor vehicle",
              "automobile",
              "automotive",
              "vehicle",
              "cmvr",
              "ais",
              "road safety",
              "highway",
              "user fee",
              "petroleum",
              "fuel",
              "petrol",
              "diesel",
              "ethanol",
              "biofuel",
              "cbg",
              "hydrogen",
              "electric vehicle",
              "battery",
              "emission",
              "mobility",
              "auto component"
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html,application/xhtml+xml"
          })

          home_response = session.get(
              "https://egazette.gov.in/",
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          session_match = re.search(
              r"https://egazette\.gov\.in/\(S\([^)]+\)\)",
              home_response.url
          )

          if not session_match:
              raise RuntimeError("eGazette session URL was not generated.")

          session_base = session_match.group(0)
          recent_url = session_base + "/RecentUploads.aspx?Category=6"

          recent_response = session.get(
              recent_url,
              headers={"Referer": home_response.url},
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          if recent_response.status_code != 200:
              raise RuntimeError(
                  f"eGazette returned status {recent_response.status_code}."
              )

          if "error.aspx" in recent_response.url.lower():
              raise RuntimeError("eGazette redirected to error.aspx.")

          soup = BeautifulSoup(recent_response.text, "html.parser")
          records = []
          for row in soup.find_all("tr"):
            cells = row.find_all("td", recursive=False)

            if len(cells) >= 10:
              print("========== PDF LINK TEST ==========")
              print(row.prettify())
              break
        
          for row in soup.find_all("tr"):
              cells = [
                  cell.get_text(" ", strip=True)
                  for cell in row.find_all("td", recursive=False)
              ]

              if len(cells) < 10:
                  continue

              gazette_number = cells[8].strip()

              if not re.match(
                  r"^[A-Z]{2}-[A-Z]{2}-E-\d{8}-\d+$",
                  gazette_number
              ):
                  continue

              ministry = cells[1].strip()
              title = cells[4].strip()
              relevance_text = f"{ministry} {title}".lower()

              relevant = "Yes" if any(
                  keyword in relevance_text
                  for keyword in automobile_keywords
              ) else "No"

              records.append({
                  "gazette_number": gazette_number,
                  "title": title,
                  "relevant": relevant
              })

          try:
              with open(state_file, "r", encoding="utf-8") as state:
                  seen_ids = set(json.load(state))
          except (FileNotFoundError, json.JSONDecodeError):
              seen_ids = set()

          new_records = [
              record
              for record in records
              if record["gazette_number"] not in seen_ids
          ]

          subject = "eGazette Hourly Intelligence"

          if not new_records:
              email_message = """
              <html>
              <body style="font-family:Arial,sans-serif;">
                  <h2>eGazette Hourly Intelligence</h2>
                  <p><strong>Nothing New</strong></p>
              </body>
              </html>
              """
          else:
              table_rows = []

              for serial, record in enumerate(new_records, start=1):
                  table_rows.append(
                      "<tr>"
                      f"<td>{serial}</td>"
                      f"<td>{html.escape(record['gazette_number'])}</td>"
                      f"<td>{record['relevant']}</td>"
                      f"<td>{html.escape(record['title'])}</td>"
                      f"<td>{public_source_link}Open eGazette</a></td>"
                      "</tr>"
                  )

              email_message = f"""
              <html>
              <body style="font-family:Arial,sans-serif;">
                  <h2>eGazette Hourly Intelligence</h2>
                  <table style="border-collapse:collapse;width:100%;">
                      <tr style="background-color:#d9eaf7;">
                          <th style="border:1px solid #777;padding:8px;">S.No.</th>
                          <th style="border:1px solid #777;padding:8px;">Gazette No.</th>
                          <th style="border:1px solid #777;padding:8px;">
                              Relevant to Automobile Industry
                          </th>
                          <th style="border:1px solid #777;padding:8px;">Title</th>
                          <th style="border:1px solid #777;padding:8px;">Source Link</th>
                      </tr>
                      {''.join(table_rows)}
                  </table>
              </body>
              </html>
              """

          power_automate_url = __import__("os").environ["POWER_AUTOMATE_URL"]

          mail_response = requests.post(
              power_automate_url,
              json={
                  "subject": subject,
                  "message": email_message
              },
              timeout=60
          )

          print("Power Automate status:", mail_response.status_code)

          if mail_response.status_code not in (200, 202):
              print(mail_response.text)
              raise RuntimeError("Power Automate email request failed.")

          all_seen_ids = sorted(
              seen_ids.union(
                  record["gazette_number"] for record in records
              )
          )

          with open(state_file, "w", encoding="utf-8") as state:
              json.dump(all_seen_ids, state, indent=2)

          print("New Gazette records:", len(new_records))
          print("Email request sent successfully.")
          PY

      - name: Save processed Gazette IDs
        run: |
          git config user.name "eGazette Monitor"
          git config user.email "actions@github.com"
          git add seen_gazette_ids.json
          git diff --cached --quiet || git commit -m "Update processed Gazette IDs"
          git push
