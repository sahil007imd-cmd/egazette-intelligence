name: eGazette Intelligent Email Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: egazette-intelligent-test
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf requests beautifulsoup4

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Process eGazette notifications
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          python - <<'PY'
          import html
          import json
          import os
          import re
          import shutil
          from datetime import datetime
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests
          from bs4 import BeautifulSoup
          from playwright.sync_api import (
              TimeoutError as PlaywrightTimeoutError,
              sync_playwright
          )
          from pypdf import PdfReader

          # -------------------------------------------------
          # SETTINGS
          # -------------------------------------------------

          HOME_URL = "https://egazette.gov.in/"
          STATE_FILE = Path("seen_gazette_ids.json")
          DOWNLOAD_DIR = Path("downloaded_gazettes")
          DIAGNOSTIC_DIR = Path("diagnostic_files")

          MAX_PDFS_PER_RUN = 8
          MAX_CHARACTERS_PER_PDF = 14000
          MAX_TOTAL_AI_CHARACTERS = 90000

          POWER_AUTOMATE_URL = os.environ.get(
              "POWER_AUTOMATE_URL",
              ""
          ).strip()

          if not POWER_AUTOMATE_URL:
              raise RuntimeError(
                  "POWER_AUTOMATE_URL secret is missing."
              )

          DOWNLOAD_DIR.mkdir(exist_ok=True)
          DIAGNOSTIC_DIR.mkdir(exist_ok=True)

          # -------------------------------------------------
          # PRIMARY SCREENING RULES
          # -------------------------------------------------

          RELEVANT_MINISTRIES = [
              "road transport",
              "heavy industries",
              "heavy industry",
              "environment forest",
              "environment, forest",
              "petroleum and natural gas",
              "commerce and industry",
              "commerce & industry",
              "power",
              "new and renewable energy",
              "railways",
              "finance",
              "corporate affairs",
              "electronics and information technology",
              "skill development",
              "labour and employment",
              "consumer affairs",
              "steel",
              "mines"
          ]

          RELEVANT_KEYWORDS = [
              "motor vehicle",
              "motor vehicles",
              "automobile",
              "automotive",
              "passenger vehicle",
              "commercial vehicle",
              "vehicle safety",
              "vehicle registration",
              "vehicle certification",
