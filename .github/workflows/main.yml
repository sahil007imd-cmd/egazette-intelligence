name: eGazette Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python packages
        run: python -m pip install requests

      - name: Fetch eGazette page with session
        run: |
          python - <<'PY'
          import re
          import requests
          import urllib3

          urllib3.disable_warnings()

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html,application/xhtml+xml"
          })

          home_response = session.get(
              "https://egazette.gov.in/",
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          print("Homepage URL:", home_response.url)
          print("Homepage status:", home_response.status_code)

          match = re.search(r"https://egazette\.gov\.in/\(S\([^)]+\)\)", home_response.url)

          if not match:
              raise RuntimeError("eGazette session URL was not generated.")

          session_base = match.group(0)

          recent_url = session_base + "/RecentUploads.aspx?Category=6"

          recent_response = session.get(
              recent_url,
              headers={"Referer": home_response.url},
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          print("Recent uploads URL:", recent_response.url)
          print("Status:", recent_response.status_code)
          print("HTML length:", len(recent_response.text))

          if "error.aspx" in recent_response.url.lower():
              raise RuntimeError("eGazette redirected the request to error.aspx.")

          with open("egazette.html", "w", encoding="utf-8") as file:
              file.write(recent_response.text)

          print(recent_response.text[:3000])
          PY
          
