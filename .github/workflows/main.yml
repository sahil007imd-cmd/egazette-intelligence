name: eGazette Playwright PDF Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium browser
        run: |
          python -m playwright install --with-deps chromium

      - name: Open eGazette and download first PDF
        run: |
          python - <<'PY'
          import os
          import re
          import time

          from pathlib import Path
          from playwright.sync_api import (
              TimeoutError as PlaywrightTimeoutError,
              sync_playwright
          )

          HOME_URL = "https://egazette.gov.in/"
          OUTPUT_FILE = Path("first_gazette_playwright_test.pdf")
          SCREENSHOT_FILE = Path("egazette_playwright_screen.png")
          PAGE_HTML_FILE = Path("egazette_playwright_page.html")

          print("")
          print("========================================")
          print("EGAZETTE PLAYWRIGHT PDF DOWNLOAD TEST")
          print("========================================")

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-dev-shm-usage",
                      "--no-sandbox",
                      "--disable-http2",
                      "--disable-blink-features=AutomationControlled"
                  ]
              )

              context = browser.new_context(
                  accept_downloads=True,
                  ignore_https_errors=True,
                  viewport={
                      "width": 1600,
                      "height": 1000
                  },
                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/140.0.0.0 "
                      "Safari/537.36 "
                      "Edg/140.0.0.0"
                  ),
                  locale="en-US"
              )

              page = context.new_page()

              page.set_default_timeout(120000)
              page.set_default_navigation_timeout(120000)

              print("Opening eGazette home page...")

              home_response = page.goto(
                  HOME_URL,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              if home_response:
                  print(
                      "Home status:",
                      home_response.status
                  )

              print(
                  "Home final URL:",
                  page.url
              )

              page.wait_for_timeout(3000)

              session_match = re.search(
                  r"https://egazette\.gov\.in/"
                  r"\(S\([^)]+\)\)",
                  page.url,
                  re.IGNORECASE
              )

              if session_match:
                  session_base = session_match.group(0)
              else:
                  page_content = page.content()

                  session_match = re.search(
                      r"https://egazette\.gov\.in/"
                      r"\(S\([^)]+\)\)",
                      page_content,
                      re.IGNORECASE
                  )

                  if not session_match:
                      raise RuntimeError(
                          "eGazette session URL was not generated."
                      )

                  session_base = session_match.group(0)

              recent_url = (
                  session_base
                  + "/RecentUploads.aspx?Category=6"
              )

              print("")
              print(
                  "Opening Recent Uploads:",
                  recent_url
              )

              recent_response = page.goto(
                recent_url,
                referer=page.url,
                wait_until="domcontentloaded",
                timeout=120000
              )

              if recent_response:
                  print(
                      "Recent Uploads status:",
                      recent_response.status
                  )

              print(
                  "Recent Uploads final URL:",
                  page.url
              )

              page.wait_for_timeout(5000)

              page.screenshot(
                  path=str(SCREENSHOT_FILE),
                  full_page=True
              )

              PAGE_HTML_FILE.write_text(
                  page.content(),
                  encoding="utf-8"
              )

              if "error.aspx" in page.url.lower():
                  raise RuntimeError(
                      "eGazette redirected to error.aspx."
                  )

              pdf_buttons = page.locator(
                  'input[name*="imgbtndownload"]'
              )

              button_count = pdf_buttons.count()

              print("")
              print(
                  "PDF buttons found:",
                  button_count
              )

              if button_count == 0:
                  raise RuntimeError(
                      "No PDF download buttons were found."
                  )

              first_button = pdf_buttons.first

              button_name = first_button.get_attribute(
                  "name"
              )

              print(
                  "Selected button:",
                  button_name
              )

              gazette_row = first_button.locator(
                  "xpath=ancestor::tr[1]"
              )

              row_cells = gazette_row.locator(
                  "td"
              )

              cell_count = row_cells.count()

              cell_values = []

              for index in range(cell_count):
                  cell_text = (
                      row_cells
                      .nth(index)
                      .inner_text()
                      .strip()
                  )

                  cell_values.append(
                      " ".join(cell_text.split())
                  )

              ministry = (
                  cell_values[1]
                  if len(cell_values) > 1
                  else ""
              )

              department = (
                  cell_values[2]
                  if len(cell_values) > 2
                  else ""
              )

              title = (
                  cell_values[4]
                  if len(cell_values) > 4
                  else ""
              )

              issue_date = (
                  cell_values[6]
                  if len(cell_values) > 6
                  else ""
              )

              publish_date = (
                  cell_values[7]
                  if len(cell_values) > 7
                  else ""
              )

              gazette_number = (
                  cell_values[8]
                  if len(cell_values) > 8
                  else ""
              )

              print("")
              print("========================================")
              print("SELECTED GAZETTE")
              print("========================================")
              print("Ministry:", ministry)
              print("Department:", department)
              print("Title:", title)
              print("Issue date:", issue_date)
              print("Publish date:", publish_date)
              print("Gazette No.:", gazette_number)
              print("========================================")

              first_button.scroll_into_view_if_needed()

              page.wait_for_timeout(2000)

              download_captured = False
              popup_captured = False

              print("")
              print("Clicking the actual PDF icon...")

              # Method 1:
              # Wait for a standard browser download.
              try:
                  with page.expect_download(
                      timeout=120000
                  ) as download_info:
                      first_button.click(
                          force=True,
                          timeout=120000
                      )

                  download = download_info.value

                  download.save_as(
                      str(OUTPUT_FILE)
                  )

                  print("")
                  print(
                      "Standard browser download captured."
                  )

                  print(
                      "Suggested filename:",
                      download.suggested_filename
                  )

                  download_captured = True

              except PlaywrightTimeoutError:
                  print(
                      "No standard download event detected."
                  )

              # Method 2:
              # eGazette may open the PDF in a new tab.
              if not download_captured:
                  print(
                      "Testing for a new browser tab..."
                  )

                  page.reload(
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(5000)

                  pdf_buttons = page.locator(
                      'input[name*="imgbtndownload"]'
                  )

                  if pdf_buttons.count() == 0:
                      raise RuntimeError(
                          "PDF buttons disappeared after page reload."
                      )

                  first_button = pdf_buttons.first

                  first_button.scroll_into_view_if_needed()

                  try:
                      with context.expect_page(
                          timeout=120000
                      ) as popup_info:
                          first_button.click(
                              force=True,
                              timeout=120000
                          )

                      popup = popup_info.value

                      popup.wait_for_load_state(
                          "domcontentloaded",
                          timeout=120000
                      )

                      print(
                          "New tab URL:",
                          popup.url
                      )

                      popup_captured = True

                      popup_response = popup.request.get(
                          popup.url,
                          timeout=120000
                      )

                      popup_content = popup_response.body()

                      popup_content_type = (
                          popup_response.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      print(
                          "New tab Content-Type:",
                          popup_content_type
                      )

                      print(
                          "New tab response size:",
                          len(popup_content)
                      )

                      starts_with_pdf = (
                          popup_content[:4] == b"%PDF"
                      )

                      print(
                          "New tab starts with PDF:",
                          starts_with_pdf
                      )

                      if (
                          starts_with_pdf
                          or
                          "application/pdf"
                          in popup_content_type.lower()
                      ):
                          OUTPUT_FILE.write_bytes(
                              popup_content
                          )

                          download_captured = True

                      popup.close()

                  except PlaywrightTimeoutError:
                      print(
                          "No new browser tab detected."
                      )

              # Method 3:
              # Capture a PDF returned through an HTTP response.
              if not download_captured:
                  print(
                      "Testing for a PDF network response..."
                  )

                  page.reload(
                      wait_until="domcontentloaded",
                      timeout=120000
                  )

                  page.wait_for_timeout(5000)

                  pdf_buttons = page.locator(
                      'input[name*="imgbtndownload"]'
                  )

                  if pdf_buttons.count() == 0:
                      raise RuntimeError(
                          "PDF buttons were not found "
                          "for response test."
                      )

                  first_button = pdf_buttons.first

                  first_button.scroll_into_view_if_needed()

                  captured_pdf = {
                      "body": None,
                      "url": None,
                      "content_type": None
                  }

                  def capture_response(response):
                      try:
                          content_type = (
                              response.headers.get(
                                  "content-type",
                                  ""
                              )
                          )

                          content_disposition = (
                              response.headers.get(
                                  "content-disposition",
                                  ""
                              )
                          )

                          if (
                              "application/pdf"
                              in content_type.lower()
                              or
                              ".pdf"
                              in content_disposition.lower()
                          ):
                              captured_pdf["body"] = (
                                  response.body()
                              )

                              captured_pdf["url"] = (
                                  response.url
                              )

                              captured_pdf[
                                  "content_type"
                              ] = content_type

                      except Exception:
                          pass

                  page.on(
                      "response",
                      capture_response
                  )

                  first_button.click(
                      force=True,
                      timeout=120000
                  )

                  page.wait_for_timeout(15000)

                  if captured_pdf["body"]:
                      OUTPUT_FILE.write_bytes(
                          captured_pdf["body"]
                      )

                      print(
                          "PDF response URL:",
                          captured_pdf["url"]
                      )

                      print(
                          "PDF Content-Type:",
                          captured_pdf["content_type"]
                      )

                      download_captured = True

              print("")
              print("========================================")
              print("PLAYWRIGHT TEST RESULT")
              print("========================================")
              print(
                  "Download captured:",
                  download_captured
              )
              print(
                  "Popup detected:",
                  popup_captured
              )
              print(
                  "Output exists:",
                  OUTPUT_FILE.exists()
              )

              if OUTPUT_FILE.exists():
                  file_size = OUTPUT_FILE.stat().st_size
                  file_header = OUTPUT_FILE.read_bytes()[:4]

                  print(
                      "Output file size:",
                      file_size
                  )

                  print(
                      "Starts with PDF:",
                      file_header == b"%PDF"
                  )
              else:
                  print(
                      "Output file size:",
                      0
                  )

                  print(
                      "Starts with PDF:",
                      False
                  )

              print("========================================")

              browser.close()

          if not OUTPUT_FILE.exists():
              raise RuntimeError(
                  "Browser click completed, but no PDF "
                  "file was captured."
              )

          pdf_bytes = OUTPUT_FILE.read_bytes()

          if pdf_bytes[:4] != b"%PDF":
              raise RuntimeError(
                  "The captured file is not a valid PDF."
              )

          print("")
          print("PDF DOWNLOAD SUCCESSFUL")
          print("Saved as:", OUTPUT_FILE)
          print("PDF size:", len(pdf_bytes))
          PY

      - name: Upload downloaded PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Playwright-PDF
          path: first_gazette_playwright_test.pdf
          retention-days: 3
          if-no-files-found: error

      - name: Upload diagnostic files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Playwright-Diagnostic
          path: |
            egazette_playwright_screen.png
            egazette_playwright_page.html
            first_gazette_playwright_test.pdf
          retention-days: 3
          if-no-files-found: ignore
