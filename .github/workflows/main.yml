name: eGazette Playwright PDF Viewer Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-browser-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Download Gazette PDF through viewer
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          from urllib.parse import urljoin, unquote

          from playwright.sync_api import (
              TimeoutError as PlaywrightTimeoutError,
              sync_playwright
          )

          HOME_URL = "https://egazette.gov.in/"

          PDF_FILE = Path(
              "first_gazette_playwright_test.pdf"
          )

          MAIN_SCREENSHOT = Path(
              "egazette_recent_uploads.png"
          )

          VIEWER_SCREENSHOT = Path(
              "egazette_pdf_viewer.png"
          )

          VIEWER_HTML = Path(
              "egazette_pdf_viewer.html"
          )

          print("")
          print("========================================")
          print("EGAZETTE PDF VIEWER TEST")
          print("========================================")

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-dev-shm-usage",
                      "--no-sandbox",
                      "--disable-http2",
                      "--disable-blink-features="
                      "AutomationControlled"
                  ]
              )

              context = browser.new_context(
                  accept_downloads=True,
                  ignore_https_errors=True,
                  viewport={
                      "width": 1600,
                      "height": 1000
                  },
                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/140.0.0.0 "
                      "Safari/537.36 "
                      "Edg/140.0.0.0"
                  ),
                  locale="en-US"
              )

              page = context.new_page()

              page.set_default_timeout(120000)
              page.set_default_navigation_timeout(120000)

              print("Opening eGazette home page...")

              home_response = page.goto(
                  HOME_URL,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              if home_response:
                  print(
                      "Home status:",
                      home_response.status
                  )

              print(
                  "Home final URL:",
                  page.url
              )

              page.wait_for_timeout(3000)

              session_match = re.search(
                  r"https://egazette\.gov\.in/"
                  r"\(S\([^)]+\)\)",
                  page.url,
                  re.IGNORECASE
              )

              if not session_match:
                  session_match = re.search(
                      r"https://egazette\.gov\.in/"
                      r"\(S\([^)]+\)\)",
                      page.content(),
                      re.IGNORECASE
                  )

              if not session_match:
                  raise RuntimeError(
                      "eGazette session URL was not generated."
                  )

              session_base = session_match.group(0)

              recent_url = (
                  session_base
                  + "/RecentUploads.aspx?Category=6"
              )

              print("")
              print(
                  "Opening Recent Uploads:",
                  recent_url
              )

              recent_response = page.goto(
                  recent_url,
                  referer=page.url,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              if recent_response:
                  print(
                      "Recent Uploads status:",
                      recent_response.status
                  )

              print(
                  "Recent Uploads final URL:",
                  page.url
              )

              if "error.aspx" in page.url.lower():
                  raise RuntimeError(
                      "eGazette redirected to error.aspx."
                  )

              page.wait_for_timeout(5000)

              page.screenshot(
                  path=str(MAIN_SCREENSHOT),
                  full_page=True
              )

              pdf_buttons = page.locator(
                  'input[name*="imgbtndownload"]'
              )

              button_count = pdf_buttons.count()

              print("")
              print(
                  "PDF buttons found:",
                  button_count
              )

              if button_count == 0:
                  raise RuntimeError(
                      "No PDF download buttons were found."
                  )

              selected_button = pdf_buttons.first

              selected_button.scroll_into_view_if_needed()

              gazette_row = selected_button.locator(
                  "xpath=ancestor::tr[1]"
              )

              row_cells = gazette_row.locator("td")

              cell_values = []

              for index in range(row_cells.count()):
                  value = (
                      row_cells
                      .nth(index)
                      .inner_text()
                      .strip()
                  )

                  cell_values.append(
                      " ".join(value.split())
                  )

              ministry = (
                  cell_values[1]
                  if len(cell_values) > 1
                  else ""
              )

              department = (
                  cell_values[2]
                  if len(cell_values) > 2
                  else ""
              )

              title = (
                  cell_values[4]
                  if len(cell_values) > 4
                  else ""
              )

              gazette_number = (
                  cell_values[8]
                  if len(cell_values) > 8
                  else ""
              )

              print("")
              print("========================================")
              print("SELECTED GAZETTE")
              print("========================================")
              print("Ministry:", ministry)
              print("Department:", department)
              print("Title:", title)
              print("Gazette No.:", gazette_number)
              print("========================================")

              viewer_responses = []

              def record_response(response):
                  try:
                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      content_disposition = (
                          response.headers.get(
                              "content-disposition",
                              ""
                          )
                      )

                      response_url = response.url

                      if (
                          "application/pdf"
                          in content_type.lower()
                          or
                          ".pdf" in response_url.lower()
                          or
                          ".pdf"
                          in content_disposition.lower()
                      ):
                          viewer_responses.append({
                              "url": response_url,
                              "content_type": content_type,
                              "response": response
                          })

                          print(
                              "Possible PDF response:",
                              response_url
                          )

                          print(
                              "Possible PDF Content-Type:",
                              content_type
                          )

                  except Exception as error:
                      print(
                          "Response inspection warning:",
                          str(error)
                      )

              context.on(
                  "response",
                  record_response
              )

              print("")
              print("Clicking PDF icon...")

              try:
                  with context.expect_page(
                      timeout=120000
                  ) as popup_info:
                      selected_button.click(
                          force=True,
                          timeout=120000
                      )

                  popup = popup_info.value

              except PlaywrightTimeoutError:
                  raise RuntimeError(
                      "The PDF viewer tab did not open."
                  )

              popup.set_default_timeout(120000)

              try:
                  popup.wait_for_load_state(
                      "domcontentloaded",
                      timeout=120000
                  )
              except PlaywrightTimeoutError:
                  print(
                      "Viewer load-state timeout ignored."
                  )

              popup.wait_for_timeout(10000)

              print("")
              print(
                  "Viewer URL:",
                  popup.url
              )

              popup.screenshot(
                  path=str(VIEWER_SCREENSHOT),
                  full_page=True
              )

              viewer_html = popup.content()

              VIEWER_HTML.write_text(
                  viewer_html,
                  encoding="utf-8"
              )

              print(
                  "Viewer HTML size:",
                  len(viewer_html)
              )

              candidate_urls = []

              def add_candidate(candidate):
                  if not candidate:
                      return

                  candidate = unquote(
                      candidate.strip()
                  )

                  if candidate.startswith(
                      "javascript:"
                  ):
                      return

                  absolute_url = urljoin(
                      popup.url,
                      candidate
                  )

                  if absolute_url not in candidate_urls:
                      candidate_urls.append(
                          absolute_url
                      )

              print("")
              print("Inspecting viewer elements...")

              selectors_and_attributes = [
                  ("iframe", "src"),
                  ("embed", "src"),
                  ("object", "data"),
                  ("a", "href"),
                  ("source", "src")
              ]

              for selector, attribute in (
                  selectors_and_attributes
              ):
                  elements = popup.locator(selector)

                  count = elements.count()

                  print(
                      selector,
                      "elements:",
                      count
                  )

                  for index in range(count):
                      value = (
                          elements
                          .nth(index)
                          .get_attribute(attribute)
                      )

                      if value:
                          print(
                              selector,
                              attribute,
                              ":",
                              value
                          )

                          add_candidate(value)

              for frame in popup.frames:
                  if frame.url:
                      print(
                          "Frame URL:",
                          frame.url
                      )

                      if frame.url != popup.url:
                          add_candidate(frame.url)

              url_patterns = [
                  r"""[^"']+\.pdf(?:\?[^"']*?)["']""",
                  r"""[^"']*ViewPDF[^"']*["']""",
                  r"""[^"']*Download[^"']*["']""",
                  r"""[^"']*GetPDF[^"']*["']"""
              ]

              for pattern in url_patterns:
                  matches = re.findall(
                      pattern,
                      viewer_html,
                      re.IGNORECASE
                  )

                  for match in matches:
                      add_candidate(match)

              print("")
              print(
                  "Candidate URLs found:",
                  len(candidate_urls)
              )

              pdf_saved = False

              # First try PDF responses already captured
              # when the viewer opened.
              for item in viewer_responses:
                  if pdf_saved:
                      break

                  try:
                      response_body = (
                          item["response"].body()
                      )

                      if response_body[:4] == b"%PDF":
                          PDF_FILE.write_bytes(
                              response_body
                          )

                          print(
                              "PDF saved from browser response."
                          )

                          pdf_saved = True

                  except Exception as error:
                      print(
                          "Could not read captured response:",
                          str(error)
                      )

              # If the browser response was not directly
              # readable, test candidate URLs using the same
              # authenticated browser session.
              if not pdf_saved:
                  for candidate_url in candidate_urls:
                      print("")
                      print(
                          "Testing candidate:",
                          candidate_url
                      )

                      try:
                          candidate_response = (
                              context.request.get(
                                  candidate_url,
                                  headers={
                                      "Referer": popup.url
                                  },
                                  timeout=120000,
                                  fail_on_status_code=False
                              )
                          )

                          candidate_type = (
                              candidate_response.headers.get(
                                  "content-type",
                                  ""
                              )
                          )

                          candidate_body = (
                              candidate_response.body()
                          )

                          starts_with_pdf = (
                              candidate_body[:4]
                              == b"%PDF"
                          )

                          print(
                              "Candidate status:",
                              candidate_response.status
                          )

                          print(
                              "Candidate Content-Type:",
                              candidate_type
                          )

                          print(
                              "Candidate size:",
                              len(candidate_body)
                          )

                          print(
                              "Candidate starts with PDF:",
                              starts_with_pdf
                          )

                          if (
                              starts_with_pdf
                              or
                              "application/pdf"
                              in candidate_type.lower()
                          ):
                              PDF_FILE.write_bytes(
                                  candidate_body
                              )

                              print(
                                  "PDF saved from candidate URL."
                              )

                              pdf_saved = True
                              break

                      except Exception as error:
                          print(
                              "Candidate failed:",
                              str(error)
                          )

              print("")
              print("========================================")
              print("PDF VIEWER TEST RESULT")
              print("========================================")
              print(
                  "Viewer opened:",
                  True
              )
              print(
                  "Viewer URL:",
                  popup.url
              )
              print(
                  "Network PDF responses:",
                  len(viewer_responses)
              )
              print(
                  "Candidate URLs:",
                  len(candidate_urls)
              )
              print(
                  "PDF saved:",
                  pdf_saved
              )
              print(
                  "Output exists:",
                  PDF_FILE.exists()
              )

              if PDF_FILE.exists():
                  output_bytes = PDF_FILE.read_bytes()

                  print(
                      "Output size:",
                      len(output_bytes)
                  )

                  print(
                      "Starts with PDF:",
                      output_bytes[:4] == b"%PDF"
                  )

              else:
                  print(
                      "Output size:",
                      0
                  )

                  print(
                      "Starts with PDF:",
                      False
                  )

              print("========================================")

              popup.close()
              browser.close()

          if not PDF_FILE.exists():
              raise RuntimeError(
                  "The viewer opened, but the underlying "
                  "PDF could not be captured."
              )

          final_bytes = PDF_FILE.read_bytes()

          if final_bytes[:4] != b"%PDF":
              raise RuntimeError(
                  "The saved output is not a valid PDF."
              )

          print("")
          print("PDF DOWNLOAD SUCCESSFUL")
          print("Saved as:", PDF_FILE)
          print("PDF size:", len(final_bytes))
          PY

      - name: Upload downloaded PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Viewer-PDF
          path: first_gazette_playwright_test.pdf
          retention-days: 3
          if-no-files-found: error

      - name: Upload diagnostic files
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Viewer-Diagnostic
          path: |
            egazette_recent_uploads.png
            egazette_pdf_viewer.png
            egazette_pdf_viewer.html
            first_gazette_playwright_test.pdf
          retention-days: 3
          if-no-files-found: ignore
