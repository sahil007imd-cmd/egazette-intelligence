name: eGazette Intelligent Email Test

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2,5,8,11,14,17 * * *'

permissions:
  contents: write

concurrency:
  group: egazette-intelligent-email
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf requests
          python -m playwright install --with-deps chromium

      - name: Process eGazette notifications
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
          FINAL_EMAIL_URL: ${{ secrets.FINAL_EMAIL_URL }}
        run: |
          python - <<'PY'
          import html, json, os, re, time
          from pathlib import Path
          from urllib.parse import unquote, urljoin
          import requests
          from pypdf import PdfReader
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          HOME = "https://egazette.gov.in/"
          STATE = Path("seen_gazette_ids.json")
          PDF_DIR = Path("downloaded_gazettes")
          DIAG_DIR = Path("diagnostic_files")
          SUBJECT = "eGazette Hourly Intelligence"
          MAX_TEXT = 12000
          MAX_LIST_PAGES = 5

          # Direct policy signals: final Relevant decision, AI creates summary only.
          DIRECT_AUTO_TERMS = [
              "corporate average fuel economy", "cafe norm", "cafe standard",
              "fuel economy norm", "fuel economy standard", "energy consumption standard",
              "m1 category motor vehicle", "m1 category vehicle",
              "m2 category motor vehicle", "m3 category motor vehicle",
              "central motor vehicle rules", "cmvr", "automotive industry standard",
              "bharat ncap", "vehicle safety standard", "type approval",
              "vehicle certification", "vehicle homologation", "vehicle emission norm",
              "bharat stage", "bs vi", "bs6", "electric vehicle",
              "electric mobility", "battery swapping", "vehicle scrappage",
              "end of life vehicle", "automobile industry", "automotive industry",
              "passenger vehicle", "light commercial vehicle"
          ]

          # Strategic themes: PDF and AI review required; never automatic No.
          STRATEGIC_REVIEW_TERMS = [
              "compressed biogas", "bio-cng", "cbg", "satat",
              "fermented organic manure", "liquid fermented organic manure",
              "fom", "lfom", "ethanol", "flex fuel", "green hydrogen",
              "hydrogen mobility", "charging infrastructure", "advanced chemistry cell",
              "automotive battery", "auto component", "semiconductor",
              "production linked incentive", "pli scheme", "customs duty",
              "anti-dumping", "countervailing duty", "safeguard duty",
              "foreign trade policy", "free trade agreement", "quality control order",
              "bis standard", "carbon credit", "carbon market",
              "renewable purchase obligation"
          ]
          AI_URL = os.environ.get("POWER_AUTOMATE_URL", "").strip()
          EMAIL_URL = os.environ.get("FINAL_EMAIL_URL", "").strip()
          if not AI_URL or not EMAIL_URL:
              raise RuntimeError("Required GitHub secret is missing.")
          PDF_DIR.mkdir(exist_ok=True)
          DIAG_DIR.mkdir(exist_ok=True)

          ministries = [
              "road transport", "heavy industr", "environment", "petroleum",
              "commerce", "finance", "power", "renewable energy", "railways",
              "electronics", "skill development", "labour", "steel", "mines"
          ]
          terms = [
              "motor vehicle", "automobile", "automotive", "passenger vehicle",
              "commercial vehicle", "cmvr", "automotive industry standard",
              "bharat ncap", "adas", "vehicle safety", "road safety", "emission",
              "bharat stage", "bs6", "bs vi", "cafe", "fuel economy",
              "electric vehicle", "electric mobility", "charging", "battery",
              "hybrid", "cng", "bio-cng", "compressed biogas", "ethanol",
              "flex fuel", "biofuel", "hydrogen", "petrol", "diesel",
              "auto component", "semiconductor", "localisation", "localization",
              "pli scheme", "production linked incentive", "manufacturing policy",
              "industrial policy", "customs duty", "customs tariff", "import policy",
              "export policy", "foreign trade policy", "free trade agreement", "fta",
              "dgft", "logistics", "freight", "gati shakti", "scrappage",
              "recycling", "circular economy", "carbon credit", "carbon market",
              "bis standard", "quality control order", "testing centre", "testing agency"
          ]
          official_terms = [
              "appointment", "appointed", "transfer", "transferred", "posting",
              "posted", "additional charge", "assumption of charge", "retirement",
              "retired", "extension of tenure", "secretary", "joint secretary",
              "chairman", "chairperson", "director general", "member secretary"
          ]
          important_bodies = [
              "road transport", "heavy industr", "environment", "petroleum",
              "commerce", "dpiit", "dgft", "bureau of indian standards", "bis",
              "caqm", "niti aayog", "power", "renewable energy", "railways"
          ]
          exclusions = [
              "section 3a", "section 3d", "section 20a", "section 20e",
              "section 20(e)", "land acquisition", "acquisition of land",
              "competent authority for land acquisition", "toll plaza",
              "user fee notification"
          ]

          def clean(v):
              return " ".join(str(v or "").split())

          def any_in(text, values):
              return any(v in text for v in values)

          def load_seen():
              try:
                  data = json.loads(STATE.read_text(encoding="utf-8"))
                  return set(data if isinstance(data, list) else [])
              except (FileNotFoundError, json.JSONDecodeError):
                  return set()

          def save_seen(values):
              STATE.write_text(json.dumps(sorted(values), indent=2), encoding="utf-8")

          def screen(record):
              text = clean(
                  record["ministry"] + " "
                  + record["department"] + " "
                  + record["title"]
              ).lower()

              routine_patterns = [
                  r"\bsection\s*3\s*a\b", r"\bsection\s*3\s*d\b",
                  r"\bsection\s*20\s*a\b", r"\bsection\s*20\s*e\b",
                  r"\bclause\s*20\s*e\b", r"\b20\s*e\s+notification\b",
                  r"\bland acquisition\b", r"\bacquisition of land\b",
                  r"\bcompetent authority for land acquisition\b",
                  r"\btoll plaza\b", r"\buser fee notification\b",
                  r"\broad over bridge\b"
              ]

              direct_matches = [term for term in DIRECT_AUTO_TERMS if term in text]
              if direct_matches:
                  return "DIRECT_RELEVANT", "Direct automotive match: " + ", ".join(direct_matches[:3])

              if any(re.search(pattern, text, re.I) for pattern in routine_patterns):
                  return "EXCLUDED", "Routine land/toll notification"

              if any_in(text, official_terms) and any_in(text, important_bodies):
                  return "DIRECT_RELEVANT", "Official change in relevant ministry/agency"

              strategic_matches = [term for term in STRATEGIC_REVIEW_TERMS if term in text]
              if strategic_matches:
                  return "AI_REVIEW", "Strategic policy match: " + ", ".join(strategic_matches[:3])

              if any_in(text, terms):
                  return "AI_REVIEW", "Automotive/business keyword candidate"
              if any_in(text, ministries):
                  return "AI_REVIEW", "Relevant ministry candidate"

              return "EXCLUDED", "No preliminary automotive relevance"

          def parse_records(page, page_number):
              output = []
              rows = page.locator("table tr")
              for ri in range(rows.count()):
                  cells = rows.nth(ri).locator("td")
                  if cells.count() < 10:
                      continue
                  values = []
                  for ci in range(cells.count()):
                      try:
                          values.append(clean(cells.nth(ci).inner_text()))
                      except Exception:
                          values.append("")
                  gid = values[8] if len(values) > 8 else ""
                  if re.match(r"^[A-Z]{2}-[A-Z]{2}-E-\d{8}-\d+$", gid):
                      output.append({
                          "gazette_number": gid, "ministry": values[1],
                          "department": values[2], "title": values[4],
                          "issue_date": values[6], "publish_date": values[7],
                          "row_index": ri, "page_number": page_number
                      })
              return output

          def wait_for_results(page):
              try:
                  page.wait_for_selector(
                      'input[name*="imgbtndownload"]',
                      state="attached",
                      timeout=45000,
                  )
              except PWTimeout:
                  pass
              page.wait_for_timeout(4000)

          def click_page_number(page, target_page):
              if target_page == 1:
                  return True

              # Standard ASP.NET GridView pager link.
              link = page.locator(
                  f'a[href*="Page${target_page}"]'
              )
              if link.count():
                  link.first.click(force=True, timeout=60000)
                  wait_for_results(page)
                  return True

              # Visible page-number link fallback.
              text_link = page.get_by_role(
                  "link",
                  name=str(target_page),
                  exact=True,
              )
              if text_link.count():
                  text_link.first.click(force=True, timeout=60000)
                  wait_for_results(page)
                  return True

              # Page-number textbox fallback used by eGazette.
              page_box = page.locator(
                  'input[name="txtPageNo"], input[id*="txtPageNo"]'
              )
              if page_box.count():
                  page_box.first.fill(str(target_page))
                  page_box.first.press("Enter")
                  wait_for_results(page)
                  return True

              return False

          def open_results_page(page, recent_url, target_page):
              page.goto(
                  recent_url,
                  referer=HOME,
                  wait_until="domcontentloaded",
                  timeout=120000,
              )
              if "error.aspx" in page.url.lower():
                  raise RuntimeError("eGazette redirected to error.aspx")
              wait_for_results(page)

              if target_page == 1:
                  return True

              # Try direct target link first. If unavailable, move sequentially.
              if click_page_number(page, target_page):
                  return True

              for number in range(2, target_page + 1):
                  if not click_page_number(page, number):
                      return False
              return True

          def load_records(page, recent_url):
              for attempt in range(1, 4):
                  try:
                      if not open_results_page(page, recent_url, 1):
                          raise RuntimeError("Could not open Recent Uploads page 1")

                      all_records = []
                      seen_on_pages = set()

                      for page_number in range(1, MAX_LIST_PAGES + 1):
                          if page_number > 1:
                              if not open_results_page(
                                  page,
                                  recent_url,
                                  page_number,
                              ):
                                  print(
                                      f"Pagination stopped before page {page_number}."
                                  )
                                  break

                          page_records = parse_records(
                              page,
                              page_number,
                          )
                          print(
                              f"Gazette records found on list page "
                              f"{page_number}: {len(page_records)}"
                          )

                          page_ids = {
                              item["gazette_number"]
                              for item in page_records
                          }
                          if not page_records or page_ids == seen_on_pages:
                              break

                          seen_on_pages = page_ids
                          all_records.extend(page_records)

                          # No pager link to the next page means this is the end.
                          next_page = page_number + 1
                          has_next = (
                              page.locator(
                                  f'a[href*="Page${next_page}"]'
                              ).count()
                              or page.get_by_role(
                                  "link",
                                  name=str(next_page),
                                  exact=True,
                              ).count()
                              or page.locator(
                                  'input[name="txtPageNo"], '
                                  'input[id*="txtPageNo"]'
                              ).count()
                          )
                          if not has_next:
                              break

                      # Deduplicate while retaining upload/page order.
                      unique_records = []
                      unique_ids = set()
                      for item in all_records:
                          if item["gazette_number"] in unique_ids:
                              continue
                          unique_ids.add(item["gazette_number"])
                          unique_records.append(item)

                      print(
                          f"Total Gazette records across pages: "
                          f"{len(unique_records)}"
                      )
                      if unique_records:
                          return unique_records

                  except Exception as exc:
                      print(f"Attempt {attempt} warning: {exc}")

                  try:
                      page.screenshot(
                          path=str(
                              DIAG_DIR / f"attempt_{attempt}.png"
                          ),
                          full_page=True,
                      )
                      (
                          DIAG_DIR / f"attempt_{attempt}.html"
                      ).write_text(
                          page.content(),
                          encoding="utf-8",
                      )
                  except Exception:
                      pass

                  if attempt < 3:
                      page.goto(
                          HOME,
                          wait_until="domcontentloaded",
                          timeout=120000,
                      )
                      page.wait_for_timeout(5000)
                      time.sleep(5 * attempt)

              return []

          def find_pdf(context, viewer, gid):
              try:
                  viewer.wait_for_load_state("domcontentloaded", timeout=120000)
              except PWTimeout:
                  pass
              viewer.wait_for_timeout(8000)
              source = viewer.content()
              candidates = []
              def add(value):
                  if not value:
                      return
                  value = unquote(str(value).strip())
                  if value.startswith("javascript:"):
                      return
                  full = urljoin(viewer.url, value)
                  if full not in candidates:
                      candidates.append(full)
              for selector, attr in [("iframe","src"),("embed","src"),("object","data"),("a","href")]:
                  els = viewer.locator(selector)
                  for i in range(els.count()):
                      try:
                          add(els.nth(i).get_attribute(attr))
                      except Exception:
                          pass
              for frame in viewer.frames:
                  if frame.url and frame.url != viewer.url:
                      add(frame.url)
              for match in re.findall(r'''[^"']+\.pdf(?:\?[^"']*)?''', source, re.I):
                  add(match)
              for url in candidates:
                  try:
                      response = context.request.get(url, headers={"Referer": viewer.url}, timeout=120000, fail_on_status_code=False)
                      body = response.body()
                      ctype = response.headers.get("content-type", "")
                      if body[:4] == b"%PDF" or "application/pdf" in ctype.lower():
                          path = PDF_DIR / (re.sub(r"[^A-Za-z0-9._-]+", "_", gid) + ".pdf")
                          path.write_bytes(body)
                          return path
                  except Exception as exc:
                      print("PDF candidate warning:", exc)
              return None

          def download_pdf(page, context, button, gid):
              button.scroll_into_view_if_needed()
              try:
                  with context.expect_page(timeout=120000) as popup:
                      button.click(force=True, timeout=120000)
                  viewer = popup.value
              except PWTimeout:
                  return None
              try:
                  return find_pdf(context, viewer, gid)
              finally:
                  try:
                      viewer.close()
                  except Exception:
                      pass

          def pdf_text(path):
              parts = []
              for number, pdf_page in enumerate(PdfReader(str(path)).pages, start=1):
                  try:
                      text = clean(pdf_page.extract_text() or "")
                  except Exception:
                      text = ""
                  if text:
                      parts.append(f"[PAGE {number}]\n{text}")
              return "\n\n".join(parts)[:MAX_TEXT]

          def block(record):
              text = record.get("pdf_text") or "PDF not processed. Classify from metadata."
              return "\n".join([
                  "GAZETTE START", "GAZETTE NUMBER: " + record["gazette_number"],
                  "MINISTRY: " + record["ministry"], "DEPARTMENT: " + record["department"],
                  "TITLE: " + record["title"], "ISSUE DATE: " + record["issue_date"],
                  "PUBLISH DATE: " + record["publish_date"],
                  "PRIMARY SCREEN: " + record["screen_reason"], "PDF TEXT:", text,
                  "GAZETTE END"
              ])

          def parse_ai(raw):
              raw = str(raw or "").strip()
              relevance_match = re.search(
                  r"RELEVANCE\s*:\s*(Not Relevant|Relevant)", raw, re.I
              )
              summary_match = re.search(
                  r"SUMMARY\s*:\s*(.*?)(?:KEY EXTRACTS|KEY IMPACT|EFFECTIVE DATE|KEY CHANGE|$)",
                  raw, re.I | re.S
              )
              summary = clean(
                  summary_match.group(1) if summary_match
                  else re.sub(r"<[^>]+>", " ", raw)
              )
              if re.search(r"no material impact on MSIL identified", raw, re.I):
                  return "Not Relevant", "No material impact on MSIL identified."
              if not relevance_match:
                  return "Pending Review", "AI response was inconclusive. Manual review required."
              relevance = relevance_match.group(1).title()
              if relevance == "Not Relevant":
                  return "Not Relevant", "No material impact on MSIL identified."
              if len(summary) < 60 or summary.lower().startswith("relevant notification identified"):
                  return "Pending Review", "AI summary was inconclusive. Manual review required."
              return "Relevant", summary[:1800]

          seen = load_seen()
          pdf_count = 0

          with sync_playwright() as pw:
              browser = pw.chromium.launch(headless=True, args=["--disable-dev-shm-usage","--no-sandbox","--disable-http2"])
              context = browser.new_context(accept_downloads=True, ignore_https_errors=True, viewport={"width":1600,"height":1000})
              page = context.new_page()
              page.set_default_timeout(120000)
              page.goto(HOME, wait_until="domcontentloaded", timeout=120000)
              page.wait_for_timeout(3000)
              session = re.search(r"https://egazette\.gov\.in/\(S\([^)]+\)\)", page.url, re.I) or re.search(r"https://egazette\.gov\.in/\(S\([^)]+\)\)", page.content(), re.I)
              if not session:
                  raise RuntimeError("eGazette session URL was not generated")
              recent = session.group(0) + "/RecentUploads.aspx?Category=6"
              records = load_records(page, recent)
              if not records:
                  raise RuntimeError("No valid Gazette records found after 3 attempts")
              new_records = [r for r in records if r["gazette_number"] not in seen]
              print("New records:", len(new_records))

              processing_records = sorted(
                  new_records,
                  key=lambda r: (
                      0 if screen(r)[0] == "DIRECT_RELEVANT" else
                      1 if screen(r)[0] == "AI_REVIEW" else 2,
                      r["page_number"], r["row_index"]
                  )
              )

              for record in processing_records:
                  decision, reason = screen(record)
                  record["screen_decision"] = decision
                  record["screen_reason"] = reason
                  record["pdf_text"] = ""

                  if decision == "EXCLUDED":
                      record["relevance"] = "Not Relevant"
                      record["summary"] = "No material impact on MSIL identified."
                      continue

                  if not open_results_page(
                      page,
                      recent,
                      record["page_number"],
                  ):
                      record["screen_reason"] += "; list page unavailable"
                      continue

                  rows = page.locator("table tr")
                  if record["row_index"] >= rows.count():
                      record["screen_reason"] += "; row unavailable"
                      continue
                  button = rows.nth(record["row_index"]).locator(
                      'input[name*="imgbtndownload"]'
                  )
                  if not button.count():
                      record["screen_reason"] += "; PDF button unavailable"
                      continue
                  path = download_pdf(page, context, button.first, record["gazette_number"])
                  if path:
                      record["pdf_text"] = pdf_text(path)
                      if record["pdf_text"]:
                          pdf_count += 1
                      else:
                          record["screen_reason"] += "; PDF text unavailable"
                  else:
                      record["screen_reason"] += "; PDF download failed"

              browser.close()

          analyses = []
          for record in new_records:
              if "relevance" in record:
                  analyses.append(record)
                  continue

              direct = record.get("screen_decision") == "DIRECT_RELEVANT"
              if direct:
                  instruction = block(record) + "\n\nSUMMARY TASK:\nThis Gazette is deterministically Relevant to MSIL because of direct automotive evidence in the ministry/title. Do not reassess or reject relevance. Return only:\nRELEVANCE: Relevant\nSUMMARY: 4 to 5 concise sentences covering what changed; applicability/effective date; automobile-industry significance; specific MSIL implication/compliance action; and one short accurate Gazette quote. Never write No material impact."
              else:
                  instruction = block(record) + "\n\nANALYSIS TASK:\nAssess this Gazette for MSIL. Routine 3A, 3D, 20A, 20E, land, toll and user-fee matters are Not Relevant. Trade, fuels, CBG, EV, emissions, safety, standards, components, manufacturing, environment affecting plants, and relevant official movements may be Relevant. Return only:\nRELEVANCE: Relevant or Not Relevant\nSUMMARY: If Relevant, write 4 to 5 concise sentences covering what changed, applicability/timeline, automotive relevance, MSIL implication/action, and one accurate quote. If Not Relevant, write exactly No material impact on MSIL identified."

              response = requests.post(
                  AI_URL,
                  json={"subject": SUBJECT, "message": instruction, "mode": "ANALYZE"},
                  timeout=600
              )
              print("AI status", record["gazette_number"], response.status_code)
              if response.status_code not in (200, 202):
                  record["relevance"] = "Pending Review"
                  record["summary"] = "AI service failed. Manual review required."
              else:
                  ai_relevance, ai_summary = parse_ai(response.text)
                  if direct:
                      record["relevance"] = "Relevant"
                      if ai_relevance == "Relevant" and "Manual review" not in ai_summary:
                          record["summary"] = ai_summary
                      else:
                          record["summary"] = (
                              "Direct automotive regulation identified from the Gazette title. "
                              "Detailed AI summary was inconclusive; immediate manual review is required."
                          )
                  else:
                      record["relevance"] = ai_relevance
                      record["summary"] = ai_summary
              analyses.append(record)

          if not new_records:
              email_html = '<html><body style="font-family:Arial,sans-serif;"><p style="font-size:18px;"><strong>No New</strong></p></body></html>'
          else:
              opening = "Alert" if any(r["relevance"] == "Relevant" for r in analyses) else "New Uploads"
              cell = "border:1px solid #777;padding:8px;vertical-align:top;"
              rows_html = []
              for item in analyses:
                  yes = item["relevance"] == "Relevant"
                  pending = item["relevance"] == "Pending Review"
                  colour = "#E2F0D9" if yes else ("#FFF2CC" if pending else "#E7E6E6")
                  relevant_text = "Yes" if yes else ("Pending Review" if pending else "No")
                  rows_html.append(
                      f'<tr style="background-color:{colour};">'
                      f'<td style="{cell}">{relevant_text}</td>'
                      f'<td style="{cell}">{html.escape(item["gazette_number"])}</td>'
                      f'<td style="{cell}">{html.escape(item["ministry"])}</td>'
                      f'<td style="{cell}">{html.escape(item["title"])}</td>'
                      f'<td style="{cell}">{html.escape(item["summary"])}</td></tr>'
                  )
              email_html = (
                  '<html><body style="font-family:Arial,sans-serif;">'
                  f'<p style="font-size:18px;"><strong>{opening}</strong></p>'
                  '<table style="border-collapse:collapse;width:100%;">'
                  '<tr style="background-color:#D9EAF7;">'
                  '<th style="border:1px solid #777;padding:8px;">Relevant</th>'
                  '<th style="border:1px solid #777;padding:8px;">Gazette No.</th>'
                  '<th style="border:1px solid #777;padding:8px;">Ministry</th>'
                  '<th style="border:1px solid #777;padding:8px;">Title</th>'
                  '<th style="border:1px solid #777;padding:8px;">Summary</th>'
                  '</tr>' + ''.join(rows_html) + '</table></body></html>'
              )

          final = requests.post(EMAIL_URL, json={"subject": SUBJECT,"message": email_html}, timeout=120)
          print("Final email status:", final.status_code)
          if final.status_code not in (200, 202):
              print(final.text[:1000])
              raise RuntimeError("Final email request failed")

          processed = {r["gazette_number"] for r in new_records}
          seen.update(processed)
          save_seen(seen)
          print("INTELLIGENT EGAZETTE RUN COMPLETE")
          print("New Gazette records:", len(new_records))
          print("PDFs downloaded/read:", pdf_count)
          print("Processed IDs saved:", len(processed))
          PY

      - name: Save processed Gazette IDs
        if: success()
        run: |
          git config user.name "eGazette Monitor"
          git config user.email "actions@github.com"
          git add seen_gazette_ids.json
          git diff --cached --quiet || git commit -m "Update intelligent eGazette IDs"
          git push

      - name: Upload diagnostics and PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Intelligent-Test-Files
          path: |
            downloaded_gazettes/
            diagnostic_files/
          retention-days: 3
          if-no-files-found: ignore
