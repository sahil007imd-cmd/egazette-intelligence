name: eGazette Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Install Python packages
        run: python -m pip install requests beautifulsoup4

      - name: Fetch and extract eGazette records
        run: |
          python - <<'PY'
          import re
          import requests
          import urllib3
          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urllib3.disable_warnings()

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0",
              "Accept": "text/html,application/xhtml+xml"
          })

          home = session.get(
              "https://egazette.gov.in/",
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          match = re.search(
              r"https://egazette\.gov\.in/\(S\([^)]+\)\)",
              home.url
          )

          if not match:
              raise RuntimeError("eGazette session URL was not generated.")

          session_base = match.group(0)
          recent_url = session_base + "/RecentUploads.aspx?Category=6"

          response = session.get(
              recent_url,
              headers={"Referer": home.url},
              verify=False,
              timeout=30,
              allow_redirects=True
          )

          if response.status_code != 200:
              raise RuntimeError(
                  f"Recent Uploads request failed: {response.status_code}"
              )

          if "error.aspx" in response.url.lower():
              raise RuntimeError("eGazette redirected to error.aspx.")

          soup = BeautifulSoup(response.text, "html.parser")
          extracted = []

          for row in soup.find_all("tr"):
              cells = [
                  cell.get_text(" ", strip=True)
                  for cell in row.find_all(["td", "th"])
              ]

              if not cells:
                  continue

              links = []
              for anchor in row.find_all("a", href=True):
                  href = urljoin(response.url, anchor["href"])
                  links.append(href)

              extracted.append({
                  "cells": cells,
                  "links": links
              })

          print("Recent uploads URL:", response.url)
          print("HTML length:", len(response.text))
          print("Table rows found:", len(extracted))
          print("")
          print("========== EXTRACTED ROWS ==========")

          for serial, record in enumerate(extracted, start=1):
              print(f"ROW {serial}")
              print(" | ".join(record["cells"]))

              for link in record["links"]:
                  print("LINK:", link)

              print("-----------------------------------")

          if not extracted:
              raise RuntimeError("No table rows were extracted.")
          PY
          
