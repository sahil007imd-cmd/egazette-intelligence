name: eGazette PDF Download Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pdf-download-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Python packages
        run: python -m pip install requests beautifulsoup4

      - name: Test eGazette PDF download
        run: |
          python - <<'PY'
          import re
          import requests
          import urllib3

          from bs4 import BeautifulSoup
          from urllib.parse import urljoin

          urllib3.disable_warnings()

          REQUEST_TIMEOUT = 120

          session = requests.Session()

          session.headers.update({
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;"
                  "q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9"
          })

          print("Opening eGazette website...")

          home_response = session.get(
              "https://egazette.gov.in/",
              verify=False,
              timeout=REQUEST_TIMEOUT,
              allow_redirects=True
          )

          home_response.raise_for_status()

          print("Home URL:", home_response.url)

          session_match = re.search(
              r"https://egazette\.gov\.in/\(S\([^)]+\)\)",
              home_response.url
          )

          if not session_match:
              session_match = re.search(
                  r"https://egazette\.gov\.in/\(S\([^)]+\)\)",
                  home_response.text
              )

          if not session_match:
              raise RuntimeError(
                  "eGazette session URL was not generated."
              )

          session_base = session_match.group(0)

          recent_url = (
              session_base
              + "/RecentUploads.aspx?Category=6"
          )

          print("Opening Recent Uploads page...")

          recent_response = session.get(
              recent_url,
              headers={
                  "Referer": home_response.url
              },
              verify=False,
              timeout=REQUEST_TIMEOUT,
              allow_redirects=True
          )

          recent_response.raise_for_status()

          if "error.aspx" in recent_response.url.lower():
              raise RuntimeError(
                  "eGazette redirected to error.aspx."
              )

          soup = BeautifulSoup(
              recent_response.text,
              "html.parser"
          )

          pdf_button = soup.find(
              "input",
              {
                  "name": re.compile(
                      r"imgbtndownload",
                      re.IGNORECASE
                  )
              }
          )

          if not pdf_button:
              raise RuntimeError(
                  "PDF download button was not found."
              )

          gazette_row = pdf_button.find_parent("tr")

          if not gazette_row:
              raise RuntimeError(
                  "Gazette row for PDF button was not found."
              )

          cells = [
              cell.get_text(" ", strip=True)
              for cell in gazette_row.find_all(
                  "td",
                  recursive=False
              )
          ]

          ministry = cells[1] if len(cells) > 1 else ""
          title = cells[4] if len(cells) > 4 else ""
          gazette_number = cells[8] if len(cells) > 8 else ""

          print("")
          print("========= SELECTED GAZETTE =========")
          print("Ministry:", ministry)
          print("Title:", title)
          print("Gazette No.:", gazette_number)
          print("Button name:", pdf_button.get("name"))
          print("====================================")
          print("")

          form = pdf_button.find_parent("form")

          if not form:
              raise RuntimeError(
                  "ASP.NET form was not found."
              )

          post_data = {}

          for field in form.find_all("input"):
              field_name = field.get("name")
              field_type = (
                  field.get("type", "")
                  .strip()
                  .lower()
              )

              if not field_name:
                  continue

              if field_type == "hidden":
                  post_data[field_name] = field.get(
                      "value",
                      ""
                  )

          button_name = pdf_button.get("name")

          if not button_name:
              raise RuntimeError(
                  "PDF button name was not found."
              )

          post_data["__EVENTTARGET"] = ""
          post_data["__EVENTARGUMENT"] = ""

          post_data[f"{button_name}.x"] = "7"
          post_data[f"{button_name}.y"] = "9"

          form_action = form.get("action", "")

          post_url = urljoin(
              recent_response.url,
              form_action
          )

          print("Submitting ASP.NET PDF request...")

          pdf_response = session.post(
              post_url,
              data=post_data,
              headers={
                  "Referer": recent_response.url,
                  "Origin": "https://egazette.gov.in",
                  "User-Agent": session.headers[
                      "User-Agent"
                  ]
              },
              verify=False,
              timeout=REQUEST_TIMEOUT,
              allow_redirects=True
          )

          content_type = pdf_response.headers.get(
              "Content-Type",
              ""
          )

          content_disposition = pdf_response.headers.get(
              "Content-Disposition",
              ""
          )

          is_pdf = (
              pdf_response.content[:4] == b"%PDF"
              or
              "application/pdf" in content_type.lower()
          )

          print("")
          print("========= PDF DOWNLOAD TEST =========")
          print("Status:", pdf_response.status_code)
          print("Content-Type:", content_type)
          print(
              "Content-Disposition:",
              content_disposition
          )
          print("File size:", len(pdf_response.content))
          print("Starts with PDF:", is_pdf)
          print("=====================================")

          if not is_pdf:
              with open(
                  "pdf_download_response.html",
                  "wb"
              ) as response_file:
                  response_file.write(
                      pdf_response.content
                  )

              raise RuntimeError(
                  "The response was not a PDF. "
                  "The response was saved for diagnosis."
              )

          output_file = "first_gazette_test.pdf"

          with open(output_file, "wb") as pdf_file:
              pdf_file.write(pdf_response.content)

          print("")
          print("PDF downloaded successfully.")
          print("Saved as:", output_file)
          PY

      - name: Upload downloaded PDF
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-PDF-Test
          path: first_gazette_test.pdf
          retention-days: 3

      - name: Upload diagnostic response
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-PDF-Diagnostic
          path: pdf_download_response.html
          if-no-files-found: ignore
          retention-days: 3
