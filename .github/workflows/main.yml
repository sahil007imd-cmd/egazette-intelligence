name: eGazette Intelligent Email Test

on:
  workflow_dispatch:
  schedule:
    # 08:00, 11:00, 14:00, 17:00, 20:00 and 23:00 IST
    # GitHub cron is configured in UTC.
    - cron: '30 2,5,8,11,14,17 * * *'

permissions:
  contents: write

concurrency:
  group: egazette-intelligent-email
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright pypdf requests

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Process eGazette notifications
        env:
          POWER_AUTOMATE_URL: ${{ secrets.POWER_AUTOMATE_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.parse import unquote, urljoin

          import requests
          from playwright.sync_api import (
              TimeoutError as PlaywrightTimeoutError,
              sync_playwright
          )
          from pypdf import PdfReader


          # --------------------------------------------------
          # SETTINGS
          # --------------------------------------------------

          HOME_URL = "https://egazette.gov.in/"

          STATE_FILE = Path(
              "seen_gazette_ids.json"
          )

          PDF_DIR = Path(
              "downloaded_gazettes"
          )

          MAX_PDFS = 6
          MAX_PDF_TEXT = 12000
          MAX_AI_INPUT = 80000

          EMAIL_SUBJECT = (
              "eGazette Hourly Intelligence"
          )

          POWER_AUTOMATE_URL = os.environ.get(
              "POWER_AUTOMATE_URL",
              ""
          ).strip()

          if not POWER_AUTOMATE_URL:
              raise RuntimeError(
                  "POWER_AUTOMATE_URL secret is missing."
              )

          PDF_DIR.mkdir(
              exist_ok=True
          )


          # --------------------------------------------------
          # PRIMARY FILTERING RULES
          # --------------------------------------------------

          RELEVANT_MINISTRIES = [
              "road transport",
              "heavy industr",
              "environment",
              "petroleum",
              "commerce",
              "finance",
              "power",
              "renewable energy",
              "railways",
              "electronics",
              "skill development",
              "labour",
              "steel",
              "mines"
          ]

          RELEVANT_TERMS = [
              "motor vehicle",
              "automobile",
              "automotive",
              "passenger vehicle",
              "commercial vehicle",
              "cmvr",
              "automotive industry standard",
              "bharat ncap",
              "adas",
              "vehicle safety",
              "road safety",
              "emission",
              "bharat stage",
              "bs6",
              "bs vi",
              "cafe",
              "fuel economy",
              "electric vehicle",
              "electric mobility",
              "charging",
              "battery",
              "hybrid",
              "cng",
              "bio-cng",
              "compressed biogas",
              "ethanol",
              "flex fuel",
              "biofuel",
              "hydrogen",
              "petrol",
              "diesel",
              "auto component",
              "semiconductor",
              "localisation",
              "localization",
              "pli scheme",
              "production linked incentive",
              "manufacturing policy",
              "industrial policy",
              "customs duty",
              "customs tariff",
              "import policy",
              "export policy",
              "foreign trade policy",
              "free trade agreement",
              "fta",
              "dgft",
              "logistics",
              "freight",
              "gati shakti",
              "scrappage",
              "recycling",
              "circular economy",
              "carbon credit",
              "carbon market",
              "bis standard",
              "quality control order",
              "testing centre",
              "testing agency"
          ]

          OFFICIAL_CHANGE_TERMS = [
              "appointment",
              "appointed",
              "transfer",
              "transferred",
              "posting",
              "posted",
              "additional charge",
              "assumption of charge",
              "relinquishment of charge",
              "retirement",
              "retired",
              "extension of tenure",
              "secretary",
              "additional secretary",
              "joint secretary",
              "chairman",
              "chairperson",
              "director general",
              "member secretary"
          ]

          IMPORTANT_BODIES = [
              "road transport",
              "heavy industr",
              "environment",
              "petroleum",
              "commerce",
              "dpiit",
              "dgft",
              "bureau of indian standards",
              "bis",
              "caqm",
              "air quality management",
              "niti aayog",
              "power",
              "renewable energy",
              "railways"
          ]

          EXCLUSION_TERMS = [
              "section 3a",
              "section 3d",
              "section 20a",
              "section 20e",
              "section 20(e)",
              "land acquisition",
              "acquisition of land",
              "competent authority for land acquisition",
              "toll plaza",
              "user fee notification"
          ]


          # --------------------------------------------------
          # HELPER FUNCTIONS
          # --------------------------------------------------

          def clean(value):
              return " ".join(
                  str(value or "").split()
              )


          def has_any(text, terms):
              return any(
                  term in text
                  for term in terms
              )


          def safe_name(value):
              value = re.sub(
                  r"[^A-Za-z0-9._-]+",
                  "_",
                  value
              )

              return value.strip("_")[:100]


          def load_seen():
              try:
                  data = json.loads(
                      STATE_FILE.read_text(
                          encoding="utf-8"
                      )
                  )

                  if isinstance(data, list):
                      return set(data)

              except (
                  FileNotFoundError,
                  json.JSONDecodeError
              ):
                  pass

              return set()


          def save_seen(values):
              STATE_FILE.write_text(
                  json.dumps(
                      sorted(values),
                      indent=2,
                      ensure_ascii=False
                  ),
                  encoding="utf-8"
              )


          def primary_screen(record):
              combined = clean(
                  record["ministry"]
                  + " "
                  + record["department"]
                  + " "
                  + record["title"]
              ).lower()

              official_change = (
                  has_any(
                      combined,
                      OFFICIAL_CHANGE_TERMS
                  )
                  and
                  has_any(
                      combined,
                      IMPORTANT_BODIES
                  )
              )

              if official_change:
                  return (
                      True,
                      "Official change in relevant ministry"
                  )

              subject_match = has_any(
                  combined,
                  RELEVANT_TERMS
              )

              excluded = has_any(
                  combined,
                  EXCLUSION_TERMS
              )

              if excluded and not subject_match:
                  return (
                      False,
                      "Routine land/toll notification"
                  )

              if subject_match:
                  return (
                      True,
                      "Automotive policy keyword match"
                  )

              if has_any(
                  combined,
                  RELEVANT_MINISTRIES
              ):
                  return (
                      True,
                      "Relevant ministry review"
                  )

              return (
                  False,
                  "No preliminary automotive relevance"
              )


          def extract_pdf_text(pdf_path):
              reader = PdfReader(
                  str(pdf_path)
              )

              output = []

              for page_number, page in enumerate(
                  reader.pages,
                  start=1
              ):
                  try:
                      page_text = clean(
                          page.extract_text() or ""
                      )

                  except Exception as error:
                      print(
                          f"Page {page_number} warning:",
                          error
                      )

                      page_text = ""

                  if page_text:
                      output.append(
                          f"[PAGE {page_number}]\n"
                          f"{page_text}"
                      )

              return "\n\n".join(
                  output
              )[:MAX_PDF_TEXT]


          def locate_pdf(
              context,
              viewer,
              gazette_number
          ):
              viewer.set_default_timeout(
                  120000
              )

              try:
                  viewer.wait_for_load_state(
                      "domcontentloaded",
                      timeout=120000
                  )

              except PlaywrightTimeoutError:
                  pass

              viewer.wait_for_timeout(
                  8000
              )

              viewer_html = viewer.content()
              candidates = []

              def add_candidate(value):
                  if not value:
                      return

                  value = unquote(
                      str(value).strip()
                  )

                  if value.startswith(
                      "javascript:"
                  ):
                      return

                  absolute_url = urljoin(
                      viewer.url,
                      value
                  )

                  if absolute_url not in candidates:
                      candidates.append(
                          absolute_url
                      )

              for selector, attribute in [
                  ("iframe", "src"),
                  ("embed", "src"),
                  ("object", "data"),
                  ("source", "src"),
                  ("a", "href")
              ]:
                  elements = viewer.locator(
                      selector
                  )

                  for index in range(
                      elements.count()
                  ):
                      try:
                          value = (
                              elements
                              .nth(index)
                              .get_attribute(attribute)
                          )

                          add_candidate(value)

                      except Exception:
                          pass

              for frame in viewer.frames:
                  if (
                      frame.url
                      and
                      frame.url != viewer.url
                  ):
                      add_candidate(
                          frame.url
                      )

              patterns = [
                  r"""[^"']+\.pdf(?:\?[^"']*)?""",
                  r"""[^"']*(?:GetPDF|DownloadPDF|ViewFile|DownloadFile)[^"']*"""
              ]

              for pattern in patterns:
                  matches = re.findall(
                      pattern,
                      viewer_html,
                      re.IGNORECASE
                  )

                  for match in matches:
                      add_candidate(match)

              print(
                  "PDF candidates:",
                  len(candidates)
              )

              for candidate in candidates:
                  try:
                      response = context.request.get(
                          candidate,
                          headers={
                              "Referer": viewer.url
                          },
                          timeout=120000,
                          fail_on_status_code=False
                      )

                      body = response.body()

                      content_type = (
                          response.headers.get(
                              "content-type",
                              ""
                          )
                      )

                      is_pdf = (
                          body[:4] == b"%PDF"
                          or
                          "application/pdf"
                          in content_type.lower()
                      )

                      if is_pdf:
                          output_path = (
                              PDF_DIR
                              / (
                                  safe_name(
                                      gazette_number
                                  )
                                  + ".pdf"
                              )
                          )

                          output_path.write_bytes(
                              body
                          )

                          print(
                              "PDF saved:",
                              output_path
                          )

                          return output_path

                  except Exception as error:
                      print(
                          "Candidate warning:",
                          error
                      )

              return None


          def download_pdf(
              page,
              context,
              button,
              gazette_number
          ):
              button.scroll_into_view_if_needed()

              page.wait_for_timeout(
                  1000
              )

              try:
                  with context.expect_page(
                      timeout=120000
                  ) as popup_info:
                      button.click(
                          force=True,
                          timeout=120000
                      )

                  viewer = popup_info.value

              except PlaywrightTimeoutError:
                  print(
                      "Viewer did not open:",
                      gazette_number
                  )

                  return None

              try:
                  pdf_path = locate_pdf(
                      context,
                      viewer,
                      gazette_number
                  )

              finally:
                  try:
                      viewer.close()
                  except Exception:
                      pass

              return pdf_path


          def make_gazette_block(record):
              pdf_text = record.get(
                  "pdf_text",
                  ""
              )

              if not pdf_text:
                  pdf_text = (
                      "PDF was not processed because the "
                      "primary filter found no likely relevance. "
                      "Classify this Gazette using the metadata."
                  )

              return "\n".join([
                  "GAZETTE START",
                  "GAZETTE NUMBER: "
                  + record["gazette_number"],
                  "MINISTRY: "
                  + record["ministry"],
                  "DEPARTMENT: "
                  + record["department"],
                  "TITLE: "
                  + record["title"],
                  "ISSUE DATE: "
                  + record["issue_date"],
                  "PUBLISH DATE: "
                  + record["publish_date"],
                  "PRIMARY SCREEN: "
                  + record["screen_reason"],
                  "PDF TEXT:",
                  pdf_text,
                  "GAZETTE END"
              ])


          # --------------------------------------------------
          # OPEN EGAZETTE
          # --------------------------------------------------

          seen_ids = load_seen()
          records = []
          pdf_count = 0

          print(
              "Previously processed IDs:",
              len(seen_ids)
          )

          with sync_playwright() as playwright:
              browser = playwright.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-dev-shm-usage",
                      "--no-sandbox",
                      "--disable-http2",
                      "--disable-blink-features=AutomationControlled"
                  ]
              )

              context = browser.new_context(
                  accept_downloads=True,
                  ignore_https_errors=True,
                  viewport={
                      "width": 1600,
                      "height": 1000
                  },
                  user_agent=(
                      "Mozilla/5.0 "
                      "(Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/140.0.0.0 "
                      "Safari/537.36"
                  )
              )

              page = context.new_page()

              page.set_default_timeout(
                  120000
              )

              page.goto(
                  HOME_URL,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              page.wait_for_timeout(
                  3000
              )

              session_match = re.search(
                  r"https://egazette\.gov\.in/"
                  r"\(S\([^)]+\)\)",
                  page.url,
                  re.IGNORECASE
              )

              if not session_match:
                  session_match = re.search(
                      r"https://egazette\.gov\.in/"
                      r"\(S\([^)]+\)\)",
                      page.content(),
                      re.IGNORECASE
                  )

              if not session_match:
                  raise RuntimeError(
                      "eGazette session URL was not generated."
                  )

              recent_url = (
                  session_match.group(0)
                  + "/RecentUploads.aspx?Category=6"
              )

              page.goto(
                  recent_url,
                  referer=page.url,
                  wait_until="domcontentloaded",
                  timeout=120000
              )

              if "error.aspx" in page.url.lower():
                  raise RuntimeError(
                      "eGazette redirected to error.aspx."
                  )

              page.wait_for_timeout(
                  5000
              )

              rows = page.locator(
                  "table tr"
              )

              for row_index in range(
                  rows.count()
              ):
                  cells = (
                      rows
                      .nth(row_index)
                      .locator("td")
                  )

                  if cells.count() < 10:
                      continue

                  values = []

                  for cell_index in range(
                      cells.count()
                  ):
                      try:
                          value = (
                              cells
                              .nth(cell_index)
                              .inner_text()
                          )

                      except Exception:
                          value = ""

                      values.append(
                          clean(value)
                      )

                  gazette_number = (
                      values[8]
                      if len(values) > 8
                      else ""
                  )

                  if not re.match(
                      r"^[A-Z]{2}-[A-Z]{2}-E-"
                      r"\d{8}-\d+$",
                      gazette_number
                  ):
                      continue

                  records.append({
                      "gazette_number": gazette_number,
                      "ministry": values[1],
                      "department": values[2],
                      "title": values[4],
                      "issue_date": values[6],
                      "publish_date": values[7],
                      "row_index": row_index
                  })

              print(
                  "Gazette records found:",
                  len(records)
              )

              # Page order is retained.
              # eGazette displays newest uploads first.
              new_records = [
                  record
                  for record in records
                  if record["gazette_number"]
                  not in seen_ids
              ]

              print(
                  "New records:",
                  len(new_records)
              )

              for record in new_records:
                  needs_pdf, reason = primary_screen(
                      record
                  )

                  record["screen_reason"] = reason
                  record["pdf_text"] = ""

                  print("")
                  print(
                      record["gazette_number"],
                      "| PDF required:",
                      needs_pdf,
                      "|",
                      reason
                  )

                  if (
                      not needs_pdf
                      or
                      pdf_count >= MAX_PDFS
                  ):
                      continue

                  current_rows = page.locator(
                      "table tr"
                  )

                  row_index = record["row_index"]

                  if row_index >= current_rows.count():
                      print(
                          "Gazette row unavailable:",
                          record["gazette_number"]
                      )

                      continue

                  row = current_rows.nth(
                      row_index
                  )

                  pdf_button = row.locator(
                      'input[name*="imgbtndownload"]'
                  )

                  if pdf_button.count() == 0:
                      print(
                          "PDF button missing:",
                          record["gazette_number"]
                      )

                      continue

                  pdf_path = download_pdf(
                      page,
                      context,
                      pdf_button.first,
                      record["gazette_number"]
                  )

                  if not pdf_path:
                      print(
                          "PDF download failed:",
                          record["gazette_number"]
                      )

                      continue

                  extracted_text = extract_pdf_text(
                      pdf_path
                  )

                  if extracted_text:
                      record["pdf_text"] = (
                          extracted_text
                      )

                      pdf_count += 1

                      print(
                          "PDF text characters:",
                          len(extracted_text)
                      )

              browser.close()


          if not records:
              raise RuntimeError(
                  "No valid Gazette records were found."
              )


          # --------------------------------------------------
          # CREATE AI INPUT
          # --------------------------------------------------

          if new_records:
              blocks = []
              current_length = 0

              for record in new_records:
                  block = make_gazette_block(
                      record
                  )

                  remaining = (
                      MAX_AI_INPUT
                      - current_length
                  )

                  if remaining <= 0:
                      break

                  block = block[:remaining]

                  blocks.append(block)

                  current_length += len(
                      block
                  )

              ai_message = """
          Analyse every Gazette block independently.

          Prepare the final email in HTML format only.

          Do not return Markdown.
          Do not use code fences.
          Do not include explanations before or after the HTML.

          Use exactly one table.

          Determine the opening line as follows:

          1. If at least one Gazette is Relevant:
             Opening line = Alert

          2. If new Gazettes exist but none are Relevant:
             Opening line = New Uploads

          The opening line must appear above the table in bold.

          The table must contain exactly these columns:

          Relevant
          Gazette No.
          Ministry
          Title
          Summary

          Include every Gazette block provided.
          Do not omit Not Relevant Gazettes.

          Preserve the order in which Gazette blocks are provided.

          For Relevant Gazettes:

          - Write Yes in the Relevant column.
          - Use a light green row background: #E2F0D9.
          - Summary must briefly explain what changed.
          - Summary must explain potential relevance to MSIL.
          - Include one short and accurate excerpt from the Gazette.
          - Keep the entire summary concise.

          For Not Relevant Gazettes:

          - Write No in the Relevant column.
          - Use a light grey row background: #E7E6E6.
          - Summary must be exactly:
            No material impact on MSIL identified.

          Treat appointment, transfer, posting, retirement,
          additional charge or tenure-extension notifications
          in MSIL-relevant ministries or agencies as Relevant.

          Use this HTML structure:

          <html>
          <body style="font-family:Arial,sans-serif;">
          <p style="font-size:18px;"><strong>Alert or New Uploads</strong></p>
          <table style="border-collapse:collapse;width:100%;">
          <tr style="background-color:#D9EAF7;">
          <th style="border:1px solid #777;padding:8px;">Relevant</th>
          <th style="border:1px solid #777;padding:8px;">Gazette No.</th>
          <th style="border:1px solid #777;padding:8px;">Ministry</th>
          <th style="border:1px solid #777;padding:8px;">Title</th>
          <th style="border:1px solid #777;padding:8px;">Summary</th>
          </tr>
          Add one table row for each Gazette.
          </table>
          </body>
          </html>

          Gazette blocks follow:

          """ + "\n\n".join(blocks)

          else:
              ai_message = """
          Return only the following HTML.

          Do not return Markdown.
          Do not use code fences.
          Do not include any other text.

          <html>
          <body style="font-family:Arial,sans-serif;">
          <p style="font-size:18px;"><strong>No New</strong></p>
          </body>
          </html>
          """


          print("")
          print(
              "PDFs downloaded/read:",
              pdf_count
          )

          print(
              "AI input characters:",
              len(ai_message)
          )


          # --------------------------------------------------
          # CALL POWER AUTOMATE ONCE
          # --------------------------------------------------

          response = requests.post(
              POWER_AUTOMATE_URL,
              json={
                  "subject": EMAIL_SUBJECT,
                  "message": ai_message
              },
              timeout=600
          )

          print(
              "Power Automate status:",
              response.status_code
          )

          print(
              "AI response preview:",
              response.text[:1500]
          )

          if response.status_code not in (
              200,
              202
          ):
              raise RuntimeError(
                  "Power Automate AI request failed."
              )


          # --------------------------------------------------
          # UPDATE PROCESSED IDS AFTER SUCCESS
          # --------------------------------------------------

          processed_ids = {
              record["gazette_number"]
              for record in new_records
          }

          seen_ids.update(
              processed_ids
          )

          save_seen(
              seen_ids
          )

          print("")
          print("======================================")
          print("INTELLIGENT EGAZETTE RUN COMPLETE")
          print("======================================")
          print(
              "New Gazette records:",
              len(new_records)
          )
          print(
              "PDFs downloaded/read:",
              pdf_count
          )
          print(
              "Power Automate status:",
              response.status_code
          )
          print(
              "Processed IDs saved:",
              len(processed_ids)
          )
          print("======================================")
          PY

      - name: Save processed Gazette IDs
        if: success()
        run: |
          git config user.name "eGazette Monitor"
          git config user.email "actions@github.com"
          git add seen_gazette_ids.json
          git diff --cached --quiet || git commit -m "Update intelligent eGazette IDs"
          git push

      - name: Upload test PDFs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eGazette-Intelligent-Test-PDFs
          path: downloaded_gazettes/
          retention-days: 3
          if-no-files-found: ignore
