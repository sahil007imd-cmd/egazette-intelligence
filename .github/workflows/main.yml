              "cmvr",
              "central motor vehicle",
              "ais ",
              "automotive industry standard",
              "bharat ncap",
              "adas",
              "road safety",
              "emission",
              "bharat stage",
              "bs vi",
              "bs6",
              "cafe",
              "fuel economy",
              "electric vehicle",
              "electric mobility",
              "charging infrastructure",
              "battery",
              "battery swapping",
              "hybrid vehicle",
              "strong hybrid",
              "cng",
              "bio-cng",
              "compressed biogas",
              "cbg",
              "ethanol",
              "flex fuel",
              "biofuel",
              "hydrogen mobility",
              "green hydrogen",
              "petrol",
              "diesel",
              "auto component",
              "semiconductor",
              "localisation",
              "localization",
              "production linked incentive",
              "pli scheme",
              "industrial policy",
              "manufacturing policy",
              "customs duty",
              "customs tariff",
              "import policy",
              "export policy",
              "foreign trade policy",
              "free trade agreement",
              "fta",
              "dgft",
              "logistics",
              "freight",
              "pm gati shakti",
              "scrappage",
              "vehicle scrapping",
              "recycling",
              "extended producer responsibility",
              "circular economy",
              "carbon credit",
              "carbon market",
              "bis standard",
              "quality control order",
              "qco",
              "testing agency",
              "testing centre",
